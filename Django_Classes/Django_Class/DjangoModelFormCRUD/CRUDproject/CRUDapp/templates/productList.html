{% extends 'base.html' %}
{% block content %}
<div style="padding: 10px; margin: 20px;">
    <a href="{% url 'addProduct' %}">Add Product</a>
</div>

<h2>Product List</h2>

<table>
  <tr>
    <th>product Name</th>
    <th>Price</th>
    <th>Quantity</th>
    <th>Action</th>
  </tr>
  
  {% for product in employees %}
    <tr>
    <td>{{product.productName}}</td>
    <td>{{product.price}}</td>
    <td>{{product.quantity}}</td>
    <td>
        <a href="{% url 'updateProduct' product.id %}">Update</a>
        <a href="{% url 'deleteProduct' product.id %}">Delete</a>
    </td>
  </tr>
  {% endfor %}
    
  
</table>


{% endblock content %}
