<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Page</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg, #eceff1, #f8fafc);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-form {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      padding: 40px 35px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: box-shadow 0.3s ease;
    }
    .login-form:hover {
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.15);
    }
    .login-form h3 {
      font-weight: 700;
      color: #212529;
      margin-bottom: 30px;
      text-align: center;
      letter-spacing: 1px;
    }
    .input-group-text {
      background-color: #f5f7fa;
      border: none;
      color: #6c757d;
      font-size: 1.2rem;
    }
    .form-control {
      border-radius: 0 0.375rem 0.375rem 0;
      border-left: none;
      font-size: 1rem;
      padding: 0.625rem 1rem;
    }
    .form-control::placeholder {
      color: #adb5bd;
      font-weight: 500;
    }
    .input-group > .form-control:focus {
      border-color: #0d6efd;
      box-shadow: none;
    }
    .form-check-label {
      user-select: none;
      font-weight: 500;
      color: #495057;
    }
    .btn-primary {
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(13, 110, 253, 0.4);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .btn-primary:hover {
      background-color: #0b5ed7;
      box-shadow: 0 6px 14px rgba(11, 94, 215, 0.6);
    }
    .text-center p {
      font-size: 0.9rem;
      margin-top: 12px;
      color: #495057;
    }
    .text-center a {
      color: #0d6efd;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    .text-center a:hover {
      color: #0b5ed7;
      text-decoration: underline;
    }
    .forgot-password {
      display: block;
      text-align: right;
      margin-top: -10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .forgot-password a {
      color: #0d6efd;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .forgot-password a:hover {
      color: #0b5ed7;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <form class="login-form" method="POST" novalidate>
    {% csrf_token %}
    <h3><i class="bi bi-box-arrow-in-right me-2"></i>Login</h3>

    {% if messages %}
  <div class="container mt-3" style="max-width: 600px;">
    {% for message in messages %}
      <div 
        class="alert alert-{{ message.tags }} alert-dismissible fade show" 
        role="alert"
        style="border-radius: 8px;"
      >
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}

    <!-- Username -->
    <div class="mb-3 input-group shadow-sm rounded">
      <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
      <input
        type="text"
        class="form-control"
        placeholder="Username"
        name="username"
        required
        autocomplete="username"
        aria-label="Username"
      />
    </div>

    <!-- Password -->
    <div class="mb-1 input-group shadow-sm rounded">
      <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
      <input
        type="password"
        class="form-control"
        placeholder="Password"
        name="password"
        required
        autocomplete="current-password"
        aria-label="Password"
      />
    </div>

    <!-- Forgot Password Link -->
    <div class="forgot-password">
      <a href=""><i class="bi bi-key-fill me-1"></i>Forgot Password?</a>
    </div>

    <!-- Remember Me Checkbox -->
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="rememberMe" name="remember_me" />
      <label class="form-check-label" for="rememberMe">Remember Me</label>
    </div>

    <!-- Submit Button -->
    <div class="d-grid mb-3">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-unlock me-1"></i> Login
      </button>
    </div>

    <!-- Sign Up Link -->
    <div class="text-center">
      <p>
        Don't have an account? 
        <a href="{% url 'signupPage' %}">Sign up here</a>
      </p>
    </div>
  </form>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
