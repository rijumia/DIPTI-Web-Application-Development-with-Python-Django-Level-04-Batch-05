<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Job Portal{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Optional: Custom CSS -->
  <style>
    body {
      background-color: #f5f7fa;
      padding-top: 70px;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar-brand i {
      color: #0d6efd;
    }
    .nav-link.active, .nav-link:hover {
      color: #0d6efd !important;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }
    footer {
      background-color: #fff;
      text-align: center;
      padding: 15px 0;
      font-size: 14px;
      color: #888;
      border-top: 1px solid #ddd;
      margin-top: 60px;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  {% include 'master/navbar.html' %}

  <!-- Main Content -->
  <main class="container py-5">
    {% block body %}
    <!-- Default content if none is overridden -->
    <div class="text-center py-5">
      <h1 class="text-primary mb-3">Welcome to Job Portal</h1>
      <p class="text-muted fs-5">Connect candidates with employers, faster and smarter.</p>
    </div>
    {% endblock body %}
  </main>

  <!-- Footer -->
  <footer>
    &copy; {{ year|default:"2025" }} Job Portal • Made with ❤️ by Riju
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
