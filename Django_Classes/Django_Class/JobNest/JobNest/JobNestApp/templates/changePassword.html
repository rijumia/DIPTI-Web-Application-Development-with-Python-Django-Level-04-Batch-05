{% extends 'master/master.html' %}

{% block title %}Change Password | JobNest{% endblock %}

{% block body %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card p-4 shadow">
      <h3 class="text-center mb-4">
        <i class="bi bi-key-fill text-warning me-2"></i> Change Password
      </h3>

      <form method="POST" action="">
        {% csrf_token %}

        <!-- Old Password -->
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-shield-lock-fill me-1"></i>Current Password</label>
          <input type="password" name="old_password" class="form-control" placeholder="Enter current password" required>
        </div>

        <!-- New Password -->
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-lock-fill me-1"></i>New Password</label>
          <input type="password" name="new_password1" class="form-control" placeholder="Enter new password" required>
        </div>

        <!-- Confirm New Password -->
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-shield-lock-fill me-1"></i>Confirm New Password</label>
          <input type="password" name="new_password2" class="form-control" placeholder="Re-enter new password" required>
        </div>

        <!-- Submit -->
        <div class="d-grid mt-3">
          <button type="submit" class="btn btn-warning text-white">
            <i class="bi bi-arrow-repeat me-1"></i> Update Password
          </button>
        </div>

        {% if messages %}
          <div class="mt-3">
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
