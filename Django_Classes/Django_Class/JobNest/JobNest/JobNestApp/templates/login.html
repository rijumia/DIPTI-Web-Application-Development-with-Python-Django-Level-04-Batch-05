<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | JobNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow">
          <h3 class="text-center mb-4">
            <i class="bi bi-box-arrow-in-right text-primary me-2"></i> Login to JobNest
          </h3>

          <form method="POST" action="">
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-person-fill me-1"></i>Username</label>
              <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-lock-fill me-1"></i>Password</label>
              <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <!-- Submit Button -->
            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-success">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
              </button>
            </div>

            <!-- Extra Links -->
            <p class="mt-3 text-center">
              Don’t have an account?
              <a href="{% url 'signupPage' %}" class="text-decoration-none">Sign Up</a>
            </p>

            {% if messages %}
              <div class="alert alert-danger mt-3">
                {% for message in messages %}
                  <div>{{ message }}</div>
                {% endfor %}
              </div>
            {% endif %}
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
