<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | JobNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow-sm border-0">
          <h3 class="text-center mb-4">
            <i class="bi bi-person-plus-fill text-primary me-2"></i> Create an Account
          </h3>

          <form method="POST" action="">
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-person-circle me-1"></i>Username</label>
              <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-envelope-fill me-1"></i>Email</label>
              <input type="email" name="email" class="form-control" placeholder="Enter email" required>
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-telephone-fill me-1"></i>Phone</label>
              <input type="text" name="phone" class="form-control" placeholder="Enter phone number" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-lock-fill me-1"></i>Password</label>
              <input type="password" name="password1" class="form-control" placeholder="Enter password" required>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-shield-lock-fill me-1"></i>Confirm Password</label>
              <input type="password" name="password2" class="form-control" placeholder="Re-enter password" required>
            </div>

            <!-- User Type -->
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-person-lines-fill me-1"></i>User Type</label>
              <select class="form-select" name="user_types" required>
                <option value="" disabled selected>Select user type</option>
                <option value="Recruiter">Recruiter</option>
                <option value="Job_seeker">Job Seeker</option>
              </select>
            </div>

            <!-- Submit Button -->
            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i> Sign Up
              </button>
            </div>

            <!-- Already have an account -->
            <p class="mt-3 text-center">
              Already have an account?
              <a href="{% url 'loginPage' %}" class="text-decoration-none">Login</a>
            </p>

            <!-- Error messages -->
            {% if form.errors %}
              <div class="alert alert-danger mt-3">
                {% for field in form %}
                  {% for error in field.errors %}
                    <div>{{ error }}</div>
                  {% endfor %}
                {% endfor %}
              </div>
            {% endif %}
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (optional for interactivity) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
