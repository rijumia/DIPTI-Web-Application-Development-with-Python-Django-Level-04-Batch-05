{% extends 'master/base.html' %}
{% load static %}

{% block title %}Update Profile | JobNest{% endblock %}

{% block body %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-person-lines-fill"></i> Update Recruiter Profile</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                         {{form}}
                        <button type="submit" class="btn btn-success"><i class="bi bi-arrow-repeat"></i> Update</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
