<!DOCTYPE html>
<html>
<head>
    <title>JobNest - Home</title>
    <link rel="stylesheet" href="css/style.css">
        <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

header {
    background: #2c3e50;
    padding: 1em 2em;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: white;
    margin-left: 1em;
    text-decoration: none;
}

.container {
    max-width: 1000px;
    margin: 2em auto;
    background: white;
    padding: 2em;
    border-radius: 8px;
}

h1, h2 {
    color: #2c3e50;
}

form {
    display: flex;
    flex-direction: column;
}

form input, form select, form textarea {
    margin-bottom: 1em;
    padding: 0.75em;
    border-radius: 5px;
    border: 1px solid #ccc;
}

form button {
    padding: 0.75em;
    background: #2980b9;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.job-card {
    border: 1px solid #ccc;
    padding: 1em;
    margin-bottom: 1em;
    border-radius: 5px;
    background: #fafafa;
}
    </style>
</head>
<body>
{% include 'master/navbar.html' %}
{% block body %}
    <div class="container">
        <h1>Welcome to JobNest</h1>
        <p>Your simple and effective job portal for recruiters and job seekers.</p>
    </div>
{% endblock body %}
</body>
</html>
