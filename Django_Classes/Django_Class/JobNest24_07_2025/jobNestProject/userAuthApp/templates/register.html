<!DOCTYPE html>
<html>
<head>
    <title>Register - JobNest</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* style.css */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

header {
    background: #2c3e50;
    padding: 1em 2em;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: white;
    margin-left: 1em;
    text-decoration: none;
}

.container {
    max-width: 1000px;
    margin: 2em auto;
    background: white;
    padding: 2em;
    border-radius: 8px;
}

h1, h2 {
    color: #2c3e50;
}

form {
    display: flex;
    flex-direction: column;
}

form input, form select, form textarea {
    margin-bottom: 1em;
    padding: 0.75em;
    border-radius: 5px;
    border: 1px solid #ccc;
}

form button {
    padding: 0.75em;
    background: #2980b9;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.job-card {
    border: 1px solid #ccc;
    padding: 1em;
    margin-bottom: 1em;
    border-radius: 5px;
    background: #fafafa;
}
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="Username" placeholder="Username" required>
            <input type="email" name="Email" placeholder="Email" required>
            <input type="password" name="Password" placeholder="Password" required>
            <input type="password" name="Confirm_Password" placeholder="Confirm Password" required>
            <select name="user_types">
                <option value="job_seeker">Job Seeker</option>
                <option value="recruiter">Recruiter</option>
            </select>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
