{% extends 'master/base.html' %}


{% block body %}
<style>
input[type=text], input[type=number],select {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

input[type=submit] {
  width: 100%;
  background-color: #4CAF50;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #45a049;
}

div {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}
</style>

 <h3>Add New Book</h3>

<div>
  <form action="" method='POST'>
    {% csrf_token %}
    {{form_info}}

    <input type="submit" value="Add Book">
  </form>
</div>
{% endblock body %}
