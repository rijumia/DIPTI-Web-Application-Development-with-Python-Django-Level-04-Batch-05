{% extends 'master/master.html' %}

{% block body %}
<div class="container mt-5" style="max-width: 700px;">
  <h4 class="mb-4 text-primary">
    <i class="bi bi-person-plus-fill"></i> Add New Employee
  </h4>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label"><i class="bi bi-diagram-3"></i> Department</label>
      <select name="department" class="form-select" required>
        <option value="">Select Department</option>
        {% for dept in departments %}
          <option value="{{ dept.id }}">{{ dept.Name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
  <label class="form-label"><i class="bi bi-image-fill"></i> Profile Picture</label>
  <input type="file" name="profile_pic" class="form-control" accept="image/*">
</div>

    <div class="mb-3">
      <label class="form-label"><i class="bi bi-person-badge-fill"></i> Full Name</label>
      <input type="text" name="full_name" class="form-control" placeholder="Enter full name" required>
    </div>

    <div class="mb-3">
      <label class="form-label"><i class="bi bi-envelope-fill"></i> Email</label>
      <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
    </div>

    <div class="mb-3">
      <label class="form-label"><i class="bi bi-telephone-fill"></i> Phone</label>
      <input type="text" name="phone" class="form-control" placeholder="Enter phone number" required>
    </div>

    <div class="mb-3">
      <label class="form-label"><i class="bi bi-person-workspace"></i> Position</label>
      <select name="position" class="form-select" required>
        <option value="">Select Position</option>
        <option value="Administrative">Administrative</option>
        <option value="StaffSupervision">Staff Supervision</option>
        <option value="ResourceManagement">Resource Management</option>
        <option value="Support">Support</option>
        <option value="Staff">Staff</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label"><i class="bi bi-calendar-event-fill"></i> Date of Joining</label>
      <input type="date" name="joining_date" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success w-100">
      <i class="bi bi-save2-fill"></i> Save Employee
    </button>
  </form>

  <div class="mt-3 text-end">
    <a href="{% url 'employeePage' %}" class="btn btn-secondary">
      <i class="bi bi-arrow-left-circle-fill"></i> Back to Employee List
    </a>
  </div>
</div>
{% endblock %}
