{% extends 'master/master.html' %}

{% block body %}
<div class="container mt-5" style="max-width: 600px;">
  <h4 class="mb-4 text-primary"><i class="bi bi-building-add"></i> Add New Department</h4>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label"><i class="bi bi-diagram-3-fill"></i> Department Name</label>
      <input type="text" name="name" class="form-control" placeholder="Enter department name" required>
    </div>

    <div class="mb-3">
      <label class="form-label"><i class="bi bi-file-text"></i> Description</label>
      <textarea name="description" class="form-control" placeholder="Enter department description" rows="3" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-save"></i> Save Department
    </button>
  </form>

  <div class="mt-3 text-end">
    <a href="{% url 'departmentPage' %}" class="btn btn-secondary">
      <i class="bi bi-arrow-left"></i> Back to Department List
    </a>
  </div>
</div>
{% endblock %}
