{% extends 'master/master.html' %}

{% block body %}
<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4><i class="bi bi-diagram-3-fill text-primary"></i> Department List</h4>
    <a href="{% url 'addDepartmentPage' %}" class="btn btn-success">
      <i class="bi bi-plus-circle"></i> Add Department
    </a>
  </div>

  {% if departs %}
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Department Name</th>
            <th scope="col">Description</th>
            <th scope="col" class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for dept in departs %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ dept.Name }}</td>
            <td>{{ dept.Description }}</td>
            <td class="text-center">
              <a href="" class="btn btn-sm btn-info text-white me-1">
                <i class="bi bi-eye"></i>
              </a>
              <a href="" class="btn btn-sm btn-warning me-1">
                <i class="bi bi-pencil-square"></i>
              </a>
              <a href="" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">
                <i class="bi bi-trash"></i>
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="alert alert-info">No departments found.</div>
  {% endif %}

</div>
{% endblock %}
