<!-- templates/signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 500px;">
      <h3 class="text-center mb-4"><i class="bi bi-person-plus-fill text-primary"></i> Create Account</h3>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-person"></i> Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
          <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
          <input type="email" name="email" class="form-control" placeholder="Enter email" required>
        </div>

        <div class="mb-3">
          <label class="form-label"><i class="bi bi-person-badge"></i> User Type</label>
          <select name="user_type" class="form-select" required>
            <option value="">Select user type</option>
            <option value="Admin">Admin</option>
            <option value="Employee">Employee</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label"><i class="bi bi-lock"></i> Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <div class="mb-3">
          <label class="form-label"><i class="bi bi-shield-lock"></i> Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-2">
          <i class="bi bi-check-circle"></i> Register
        </button>

        <div class="text-center">
          <small>Already have an account? 
            <a href="{% url 'loginPage' %}" class="text-decoration-none">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
          </small>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
