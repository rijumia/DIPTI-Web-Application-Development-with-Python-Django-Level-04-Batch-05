{% extends 'master/base.html' %}

{% block content %}
<div class="container my-5">
  <div class="password-card mx-auto p-4 shadow rounded-4" style="max-width: 420px; background: #fff;">
    <h3 class="text-center mb-4" style="color: #5a4fcf;">
      <i class="bi bi-key"></i> Change Password
    </h3>

    <!-- Django Messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'changePassword' %}">
      {% csrf_token %}

      <!-- Current Password -->
      <div class="mb-3 position-relative">
        <i class="bi bi-lock position-absolute" style="left:12px; top:50%; transform:translateY(-50%); color:#777;"></i>
        <input type="password" class="form-control ps-5" name="current_password" placeholder="Current Password" required>
      </div>

      <!-- New Password -->
      <div class="mb-3 position-relative">
        <i class="bi bi-shield-lock position-absolute" style="left:12px; top:50%; transform:translateY(-50%); color:#777;"></i>
        <input type="password" class="form-control ps-5" name="new_password" placeholder="New Password" required>
      </div>

      <!-- Confirm New Password -->
      <div class="mb-3 position-relative">
        <i class="bi bi-shield-check position-absolute" style="left:12px; top:50%; transform:translateY(-50%); color:#777;"></i>
        <input type="password" class="form-control ps-5" name="confirm_password" placeholder="Confirm New Password" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary rounded-3">Update Password</button>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
