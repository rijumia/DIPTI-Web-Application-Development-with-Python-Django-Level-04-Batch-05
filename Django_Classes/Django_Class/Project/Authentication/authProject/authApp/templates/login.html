<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #c3e5ff, #f8d3ff);
      font-family: "Segoe UI", sans-serif;
    }
    .login-card {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      padding: 30px;
    }
    .login-card h3 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #5a4fcf;
    }
    .form-control:focus {
      border-color: #5a4fcf;
      box-shadow: 0 0 0 0.2rem rgba(90,79,207,0.25);
    }
    .btn-custom {
      background-color: #5a4fcf;
      color: #fff;
      border-radius: 10px;
    }
    .btn-custom:hover {
      background-color: #493fb5;
    }
    .icon-input {
      position: relative;
    }
    .icon-input i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
    }
    .icon-input input {
      padding-left: 40px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h3><i class="bi bi-box-arrow-in-right"></i> Login</h3>

    <!-- Django Messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="">
      {% csrf_token %}
      
      <!-- Username -->
      <div class="mb-3 icon-input">
        <i class="bi bi-person"></i>
        <input type="text" class="form-control" name="username" placeholder="Username" required>
      </div>

      <!-- Password -->
      <div class="mb-3 icon-input">
        <i class="bi bi-lock"></i>
        <input type="password" class="form-control" name="password" placeholder="Password" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-custom">Login</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <small>Don’t have an account? <a href="{% url 'register' %}">Register</a></small>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
