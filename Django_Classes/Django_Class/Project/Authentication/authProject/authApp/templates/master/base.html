<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyWebsite{% endblock title %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f9f9ff;
    }

    /* Navbar overrides */
    .navbar-brand, .nav-link {
      color: #fff !important;
    }

    .nav-link:hover {
      background: rgba(255,255,255,0.1);
      border-radius: 6px;
    }

    /* Dropdown items */
    .dropdown-item.text-dark:hover {
      background: rgba(90,79,207,0.1);
      color: #000 !important;
      border-radius: 6px;
    }

    .content {
      padding: 40px;
      text-align: center;
    }

    .content h1 {
      color: #5a4fcf;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Include navbar -->
  {% include 'master/navbar.html' %}

  <!-- Page content -->
  {% block content %}
  {% endblock content %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
