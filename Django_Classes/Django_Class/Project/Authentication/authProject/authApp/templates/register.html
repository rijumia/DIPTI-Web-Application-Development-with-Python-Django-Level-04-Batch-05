<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f8d3ff, #c3e5ff);
      font-family: "Segoe UI", sans-serif;
    }
    .register-card {
      max-width: 450px;
      margin: 60px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      padding: 30px;
    }
    .register-card h3 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #5a4fcf;
    }
    .form-control:focus {
      border-color: #5a4fcf;
      box-shadow: 0 0 0 0.2rem rgba(90,79,207,0.25);
    }
    .btn-custom {
      background-color: #5a4fcf;
      color: #fff;
      border-radius: 10px;
    }
    .btn-custom:hover {
      background-color: #493fb5;
    }
    .icon-input {
      position: relative;
    }
    .icon-input i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
    }
    .icon-input input,
    .icon-input select {
      padding-left: 40px;
    }
  </style>
</head>
<body>
  <div class="register-card">
    <h3><i class="bi bi-person-circle"></i> Register</h3>

    <!-- Django Messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'register' %}">
      {% csrf_token %}
      
      <!-- Username -->
      <div class="mb-3 icon-input">
        <i class="bi bi-person"></i>
        <input type="text" class="form-control" name="username" placeholder="Username" required>
      </div>

      <!-- Email -->
      <div class="mb-3 icon-input">
        <i class="bi bi-envelope"></i>
        <input type="email" class="form-control" name="email" placeholder="Email" required>
      </div>

      <!-- User Type -->
      <div class="mb-3 icon-input">
        <i class="bi bi-people"></i>
        <select class="form-control" name="userType" required>
          <option value="" disabled selected>Select User Type</option>
          <option value="Admin">Admin</option>
          <option value="Customer">Customer</option>
          <option value="Vendor">Vendor</option>
        </select>
      </div>

      <!-- Password -->
      <div class="mb-3 icon-input">
        <i class="bi bi-lock"></i>
        <input type="password" class="form-control" name="password" placeholder="Password" required>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3 icon-input">
        <i class="bi bi-shield-lock"></i>
        <input type="password" class="form-control" name="confirmPassword" placeholder="Confirm Password" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-custom">Create Account</button>
      </div>
    </form>

    <!-- Already have an account -->
    <div class="text-center mt-3">
      <small>Already have an account? <a href="{% url 'loginPage' %}">Login</a></small>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
