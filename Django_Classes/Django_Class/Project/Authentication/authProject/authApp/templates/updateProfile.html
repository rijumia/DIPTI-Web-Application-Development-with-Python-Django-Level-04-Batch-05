{% extends 'master/base.html' %}

{% block content %}
<div class="container my-5">
    <div class="card mx-auto shadow-sm rounded-4" style="max-width: 500px;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4"><i class="bi bi-pencil-square me-2"></i> Update Profile</h3>

            <!-- Django messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                {{form}}

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary rounded-3">Update Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
