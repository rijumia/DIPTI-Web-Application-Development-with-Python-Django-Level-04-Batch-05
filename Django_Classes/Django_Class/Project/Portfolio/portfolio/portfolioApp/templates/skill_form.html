{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

<h2>{{ title }}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form }}
    
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
