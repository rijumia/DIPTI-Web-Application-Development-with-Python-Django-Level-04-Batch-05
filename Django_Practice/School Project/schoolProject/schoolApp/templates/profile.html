{% extends 'base.html' %}

{% block title %}My Profile | EduPortal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-body text-center">
          <!-- Profile Picture -->
          <img src="https://via.placeholder.com/100" class="rounded-circle mb-3" alt="Profile Picture">

          <!-- Username -->
          <h4 class="card-title mb-0">{{ user.user_types }}</h4>
          <p class="text-muted">@{{ user.username }}</p>

          <!-- Email -->
          <p><i class="bi bi-envelope me-2"></i>{{ user.email }}</p>


          <!-- Actions -->
          <div class="d-grid gap-2 mt-4">
            <a href="" class="btn btn-outline-primary">
              <i class="bi bi-key"></i> Change Password
            </a>
            <a href="{% url 'logoutPage' %}" class="btn btn-outline-danger">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
